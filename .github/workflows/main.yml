
name: Android APK CI

on:
  push:
    branches:
      - "feature/8.3.18-settings-export-import-age-filter"

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Neo Backup 8.3.18 APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build release APK
        run: ./gradlew --no-daemon --stacktrace clean assembleRelease

      - name: Verify APK output
        shell: bash
        run: |
          shopt -s nullglob
          apks=(build/outputs/apk/release/*.apk)

          if (( ${#apks[@]} == 0 )); then
            echo "::error::No release APK was generated."
            exit 1
          fi

          printf 'Generated APK: %s\n' "${apks[@]}"
          sha256sum "${apks[@]}"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: neo-backup-8.3.18-release
          path: build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
