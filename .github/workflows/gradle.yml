name: Android APK CI

# CI trigger: validate the 8.3.18 release build on branch updates.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-gradle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Neo Backup 8.3.18 APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build release APK
        run: ./gradlew --no-daemon --stacktrace clean assembleRelease

      - name: Sign release APK
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          apk="build/outputs/apk/release/Neo_Backup_8.3.18_release.apk"
          test -f "$apk"
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -x "$build_tools/apksigner"
          test -x "$build_tools/zipalign"
          "$build_tools/zipalign" -c -v 4 "$apk"
          keystore="$RUNNER_TEMP/neo-backup-release.jks"
          if [[ -n "$ANDROID_KEYSTORE_BASE64" && -n "$ANDROID_KEYSTORE_PASSWORD" && -n "$ANDROID_KEY_ALIAS" && -n "$ANDROID_KEY_PASSWORD" ]]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
            store_password="$ANDROID_KEYSTORE_PASSWORD"
            key_alias="$ANDROID_KEY_ALIAS"
            key_password="$ANDROID_KEY_PASSWORD"
          else
            echo "::warning::Persistent Android signing secrets are not configured. A temporary key will be generated; APK updates signed by a different run will require uninstalling the previous build."
            store_password="$(openssl rand -hex 24)"
            key_password="$store_password"
            key_alias="neo-backup-ci"
            keytool -genkeypair -v -keystore "$keystore" -storepass "$store_password" -keypass "$key_password" -alias "$key_alias" -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Neo Backup CI, OU=Android, O=xvergilantte, C=ID"
          fi
          "$build_tools/apksigner" sign --ks "$keystore" --ks-key-alias "$key_alias" --ks-pass "pass:$store_password" --key-pass "pass:$key_password" "$apk"
          "$build_tools/apksigner" verify --verbose --print-certs "$apk"
          sha256sum "$apk"

      - name: Verify APK output
        shell: bash
        run: |
          shopt -s nullglob
          apks=(build/outputs/apk/release/*.apk)
          if (( ${#apks[@]} == 0 )); then
            echo "::error::No release APK was generated."
            exit 1
          fi
          printf 'Generated APK: %s\n' "${apks[@]}"
          sha256sum "${apks[@]}"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: neo-backup-8.3.18-release
          path: build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
